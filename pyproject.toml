[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabint"
version = "0.1.1"
description = "A deterministic, reproducible intelligence layer for single-table data."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shubham Randive" }]
keywords = [
    "mcp", "model-context-protocol", "data-analysis", "analytics", "statistics",
    "machine-learning", "rfm", "forecasting", "causal-inference", "duckdb",
    "table-intelligence", "local-first",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "ibis-framework[duckdb]",
    "pandas",
    "numpy",
    "pydantic>=2",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "shap",
    # shap pulls in numba without a lower bound; without this floor the resolver
    # picks numba 0.53 / llvmlite 0.36, which only support Python < 3.10 and
    # break installs on 3.12+. 0.59 is the first numba with 3.12 wheels.
    "numba>=0.59",
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest"]
# Heavier / system-dependent backends, imported lazily where used.
# xgboost + lightgbm: alternative gradient boosters (need libomp on macOS).
# umap-learn: non-linear dimensionality reduction (method="umap").
# prophet: alternative forecaster.
extras = ["xgboost", "lightgbm", "umap-learn", "prophet"]
# TabICL v2 tabular foundation model — opt-in `backend="tabicl"` for
# train_classifier / train_regressor. Fully open, commercial use permitted;
# GPU-recommended. Pulls in torch.
tabicl = ["tabicl>=0.1"]
# Insight-extraction primitives, imported lazily where used:
#   mlxtend  → market_basket (association rules)
#   dowhy    → causal_effect (backdoor estimation + refutation)
#   ruptures → detect_changepoints (time-series change detection)
# (explain_metric, rfm, retention_cohorts, compare_periods use core deps only.)
insights = ["mlxtend", "dowhy", "ruptures"]

[project.urls]
Homepage = "https://github.com/shubham303/TableIntelligence"
Repository = "https://github.com/shubham303/TableIntelligence"

[project.scripts]
tabint = "tabint.cli:main"
tabint-mcp = "tabint.mcp_server:main"
# Branded aliases (product name: Table Intelligence). Same entry points.
table-intelligence = "tabint.cli:main"
table-intelligence-mcp = "tabint.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
