[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular"  # PLACEHOLDER — rename before any public release
version = "0.0.0"
description = "A deterministic, reproducible intelligence layer for single-table data."
requires-python = ">=3.10"
dependencies = [
    "ibis-framework[duckdb]",
    "pandas",
    "numpy",
    "pydantic>=2",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "shap",
]

[project.optional-dependencies]
dev = ["pytest"]
# MCP server surface (for Claude Cowork / Desktop and other MCP clients).
mcp = ["mcp"]
# Heavier / system-dependent backends, imported lazily where used.
# xgboost + lightgbm: alternative gradient boosters (need libomp on macOS).
# umap-learn: non-linear dimensionality reduction (method="umap").
# prophet: alternative forecaster.
extras = ["xgboost", "lightgbm", "umap-learn", "prophet"]

[project.scripts]
tabular = "tabular.cli:main"
tabular-mcp = "tabular.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
