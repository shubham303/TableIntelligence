# Publish tabint to PyPI on every `v*` tag push.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets to manage.
# One-time setup: add this repo as a trusted publisher for the `tabint` project
# at https://pypi.org/manage/project/tabint/settings/publishing/
# (workflow file = publish.yml, environment = pypi).
name: publish

on:
  push:
    tags: ["v*"]

  # Allow manual runs from the Actions tab (builds but skips the upload step).
  workflow_dispatch:

# `contents: read` is needed at the top level so `actions/checkout` can clone
# this (private) repo. `id-token: write` is scoped to the publish job below,
# where PyPI's OIDC trusted publishing actually needs it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        # The suite touches features from the [insights] extra (ruptures,
        # mlxtend) — install it alongside dev so CI matches a full local run.
        run: uv run --extra dev --extra insights pytest -q

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Only publish on tag pushes — manual dispatch builds but does not upload.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write   # required for PyPI's OIDC trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
